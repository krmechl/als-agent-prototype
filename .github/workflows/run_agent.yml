name: Run ALS Auditor Agent

on:
  workflow_dispatch: # Allows you to trigger the agent manually
  schedule:
    - cron: '0 0 * * *' # Runs automatically once a day

jobs:
  run-agent-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the workflow permission to push changes to your repository

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Autonomous Agent Script
      run: |
        python agent_ledger.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add ledger.json index.html
        git commit -m "🤖 Autonomous Agent Update: Cryptographic Block Added" || echo "No changes to commit"
        git push
